</style><body><div class="card"><div class="brand">篝火出品</div><h1>音视频转图文</h1><p class="desc">把录屏、课程、访谈的视频或音频，一键转成知识笔记、文章、思维导图、内容总结，并可导出字幕。网页操作，中文界面。</p><h2>怎么用</h2><ol><li><span>在自己的电脑或服务器上用 Docker 部署，浏览器打开网页</span></li><li><span>在 .env 里填好大模型接口、对象存储和语音识别账号（上游固定使用火山引擎录音文件识别）</span></li><li><span>上传视频或 MP3，选择文档风格，等待转写与生成</span></li><li><span>查看图文结果，导出字幕，或继续向 AI 提问</span></li></ol><div class="fmt"><b>交付形式　</b>Docker 部署（x86 / ARM）；需要火山引擎语音识别账号、兼容 S3 的对象存储和大模型接口，音频会上传到云端</div></div></body></html>
